streaming:
  fragment_rows: 16384
  max_chars: 512
  shuffle_buffer_size: 1
  queue_size: 65536
  worker_replicas: 1
  batch_size: 2048
  batch_no_duplicates: true
  monolingual_batches: true
  language_markers: true
  holdout_row_groups: 0
  smooth_weighted_round_robin: true
  source_temperature: 0.4
  language_temperature: 0.4
  strict_unique_batches: true
  scheduler_start_batch: 1000
  seed: 20260805
loss:
  type: cached_multiple_negatives
  scale: 20.0
  mini_batch_size: 2048
  directions:
  - query_to_doc
  - doc_to_query
  partition_mode: per_direction
training:
  max_steps: 2000
  per_device_train_batch_size: 2048
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  weight_decay: 0.05
  warmup_steps: 500
  lr_scheduler_type: inverse_sqrt
  save_steps: 1000
  save_total_limit: 2
  logging_steps: 100
  dataloader_num_workers: 1
  dataloader_prefetch_factor: 1
  bf16: true
  max_tokens: 128
  split_penalty: 0.0
  save_strategy: steps
